<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verniciatura - Produzione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* Stessi colori della scheda Admin → Verniciatura del programma */
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #1d2327; --muted: #5f6b73; --line: #d5dbe0;
    --head: #37474f; --padre: #96bef0; --mr: #c8eec8; --mp: #ffdeaa; --mv: #ffcdcd;
    --rosso: #dc3232; --verde: #28963c; --blu: #1565c0; --verdescuro: #1b5e20;
    --row: 26px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.3 Inter, "Segoe UI", system-ui, sans-serif; }
  button, input, select { font: inherit; }
  .btn { border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 700; color: #fff; cursor: pointer; white-space: nowrap; }
  .btn:disabled { opacity: .55; cursor: default; }
  .verde { background: var(--verdescuro); } .blu { background: var(--blu); } .grigio { background: #546e7a; }

  /* Accesso */
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  #login form { background: var(--card); padding: 28px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  #login h1 { margin: 0 0 4px; font-size: 20px; }
  #login p { margin: 0 0 20px; color: var(--muted); }
  #login label { display: block; font-weight: 600; margin: 12px 0 4px; }
  #login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; }
  #login .btn { width: 100%; margin-top: 20px; padding: 10px; }
  #errore { color: var(--rosso); margin-top: 12px; min-height: 1.3em; }

  /* Foglio */
  #app { display: none; height: 100%; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  #agg { color: var(--muted); }
  .spazio { flex: 1; }
  .filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .filtri input[type=search] { width: 230px; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .filtri input#cercaCodice { width: 150px; }
  .filtri input.attivo { background: #ffe282; }
  #attivi { color: var(--muted); }
  #attivi b { color: var(--ink); }
  #intestazione > div { cursor: pointer; user-select: none; }
  #intestazione > div:hover { background: #455a64; }
  #intestazione > div.filtrata { background: #c79100; }
  #intestazione > div::after { content: " ▾"; opacity: .6; font-size: 11px; }
  /* Filtro di una colonna: elenco dei valori con le caselle, come nel programma */
  #popup { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
    width: 280px; max-width: calc(100vw - 32px); display: none; flex-direction: column; max-height: min(460px, calc(100vh - 32px)); }
  #popup h2 { font-size: 14px; margin: 0; padding: 10px 12px 6px; }
  #popup input[type=search] { margin: 0 12px 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  #popup .tutti { padding: 2px 12px 6px; display: flex; gap: 12px; }
  #popup .tutti a { color: var(--blu); cursor: pointer; font-weight: 600; }
  #popupLista { overflow: auto; flex: 1; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; }
  #popupLista label { display: flex; align-items: center; gap: 7px; padding: 3px 12px; cursor: pointer; white-space: nowrap; }
  #popupLista label:hover { background: #f1f4f6; }
  #popupLista .gruppo { margin: 6px 12px 2px; padding-top: 6px; border-top: 1px solid var(--line); font-weight: 700; color: var(--muted); }
  #popup .azioni { display: flex; gap: 8px; justify-content: flex-end; padding: 8px 12px; }
  .imb { font-weight: 700; margin-right: 5px; }
  #scroll { flex: 1; overflow: auto; position: relative; background: #fff; }
  #tabella { position: relative; }
  .riga { display: grid; height: var(--row); position: absolute; left: 0; }
  .riga > div { padding: 0 5px; line-height: var(--row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid #e3e7ea; border-bottom: 1px solid #e3e7ea; }
  .riga > div.d { text-align: right; }
  #intestazione { position: sticky; top: 0; z-index: 2; display: grid; height: 30px; }
  #intestazione > div { background: var(--head); color: #fff; font-weight: 700; padding: 0 5px; line-height: 30px; white-space: nowrap; overflow: hidden; border-right: 1px solid #4f6570; }
  .p > div { background: var(--padre); font-weight: 700; font-size: 14px; }
  .mr > div { background: var(--mr); } .mp > div { background: var(--mp); } .mv > div { background: var(--mv); }
  .riga > div.cp { background: var(--rosso); color: #fff; font-weight: 700; }
  .riga > div.cr { background: var(--verde); color: #fff; font-weight: 700; }
  /* codice cercato col "Codice...": evidenziato in giallo (si vede in quale punto della distinta è agganciato) */
  .riga > div.trovato, .scheda .cod.trovato { background: #ffe282; color: var(--ink); font-weight: 700; }
  .scheda .cod.trovato { flex: 0 1 auto; padding: 0 4px; border-radius: 3px; }
  .scheda .l1 .q { margin-left: auto; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  footer { background: var(--card); border-top: 1px solid var(--line); padding: 6px 16px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  #vuoto { padding: 40px 16px; color: var(--muted); text-align: center; display: none; }
  #vista { display: none; }

  /* Smartphone: una scheda per riga (si legge tutta senza spostarsi di lato), tocco = tutti i dati della riga */
  #app.schede #tabella { width: 100% !important; }
  #app.schede #intestazione { display: flex; width: auto !important; height: auto; gap: 6px; padding: 6px 8px; overflow-x: auto;
    background: var(--card); border-bottom: 1px solid var(--line); align-items: center; }
  #app.schede #intestazione::before { content: "Filtra:"; font-weight: 700; color: var(--muted); flex: none; }
  #app.schede #intestazione > div { flex: none; border: 0; border-radius: 14px; line-height: 26px; padding: 0 10px; font-size: 12px; }
  .scheda { position: absolute; left: 0; right: 0; padding: 5px 10px; border-bottom: 1px solid #d5dbe0; overflow: hidden; background: #fff; cursor: pointer; }
  .scheda > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 19px; }
  .scheda .l1 { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .scheda .cod { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .scheda .q { flex: none; font-weight: 700; }
  .scheda .l3 { font-size: 12px; color: var(--muted); }
  .scheda .l3 b { color: var(--ink); font-weight: 600; }
  .scheda.p { background: var(--padre); border-top: 2px solid #6f9bd6; }
  .scheda.p .l1 { font-size: 15px; font-weight: 700; }
  .scheda.p .l3 { color: #263238; }
  .scheda.mr { background: var(--mr); } .scheda.mp { background: var(--mp); } .scheda.mv { background: var(--mv); }
  .scheda .dot { margin-right: 0; flex: none; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-weight: 700; color: #fff; line-height: 17px; }
  .tag.cp { background: var(--rosso); } .tag.cr { background: var(--verde); }
  #dettaglio { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
  #dettaglio .foglio { background: var(--card); width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 14px 16px 16px; }
  #dettaglio h2 { font-size: 16px; margin: 0 0 2px; }
  #dettaglio .sotto { color: var(--muted); margin-bottom: 10px; }
  #dettaglio dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0 0 14px; }
  #dettaglio dt { color: var(--muted); font-weight: 600; }
  #dettaglio dd { margin: 0; word-break: break-word; }
  #dettaglio .btn { width: 100%; padding: 10px; }

  @media (max-width: 900px) { #vista { display: inline-block; } }
  @media (max-width: 640px) {
    header, .filtri, footer { padding-left: 16px; padding-right: 16px; }
    .filtri > * { min-width: 0; }
    /* telefono: le due ricerche e Togli filtri su una riga, meno spazio sopra le schede */
    header { padding-top: 6px; padding-bottom: 6px; }
    header .btn { padding: 6px 10px; }
    .filtri input[type=search] { width: auto; flex: 1 1 0; }
    .filtri input#cercaCodice { width: auto; flex: 0 1 34%; }
    #togli { padding: 6px 10px; }
    #attivi:empty { display: none; }
    #attivi { width: 100%; }
  }
</style>
</head>
<body>

<div id="login">
  <form id="formLogin" autocomplete="on">
    <h1>Verniciatura</h1>
    <p>Foglio distinte aperte · sola lettura</p>
    <label for="utente">Utente</label>
    <input id="utente" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn blu" type="submit" id="entra">Entra</button>
    <div id="errore"></div>
  </form>
</div>

<div id="app">
  <header>
    <h1>Verniciatura</h1>
    <span id="agg"></span>
    <span class="spazio"></span>
    <button class="btn grigio" id="vista" title="Passa dalle schede (smartphone) alla tabella come sul PC e viceversa">Tabella</button>
    <button class="btn verde" id="excel">Scarica Excel</button>
    <button class="btn blu" id="aggiorna">Aggiorna</button>
    <button class="btn grigio" id="esci">Esci</button>
  </header>
  <div class="filtri">
    <input type="search" id="cercaCodice" placeholder="Codice..." title="Cerca un codice di qualsiasi livello (SA, M, IM...): escono le distinte complete in cui è agganciato, il codice è in giallo. Con i filtri delle colonne (es. Centro = IM e M) si vedono solo quelle righe. ? = una cifra qualsiasi, * = qualsiasi testo">
    <input type="search" id="cerca" placeholder="Cerca in tutte le colonne...">
    <button class="btn grigio" id="togli">Togli filtri</button>
    <span id="attivi">Clic sull'intestazione di una colonna per filtrare (anche più valori)</span>
  </div>
  <div id="popup">
    <h2 id="popupTitolo"></h2>
    <input type="search" id="popupCerca" placeholder="Cerca un valore...">
    <div class="tutti"><a id="popupTutti">Seleziona tutti</a><a id="popupNessuno">Nessuno</a></div>
    <div id="popupLista"></div>
    <div class="azioni">
      <button class="btn grigio" id="popupTogli">Togli filtro</button>
      <button class="btn blu" id="popupOk">OK</button>
    </div>
  </div>
  <div id="scroll">
    <div id="intestazione"></div>
    <div id="tabella"></div>
    <div id="vuoto">Nessuna riga con questi filtri.</div>
  </div>
  <footer><span id="conta"></span></footer>
  <div id="dettaglio"><div class="foglio">
    <h2 id="detTitolo"></h2>
    <div class="sotto" id="detSotto"></div>
    <dl id="detDati"></dl>
    <button class="btn blu" id="detChiudi">Chiudi</button>
  </div></div>
</div>

<script>
// ===== Da compilare con i dati del progetto Supabase (Project Settings → API). La chiave pubblica si può vedere: i dati li protegge il login.
const SUPABASE_URL = "https://yzkfycwrvvqlcrnakpgu.supabase.co";
const SUPABASE_KEY = "sb_publishable_nuXDmQzVBxX-0Q2zSh4-5g_7vUKw_i0";
// Uguale al programma: un nome utente senza @ diventa nome@produzione.local
const DOMINIO = "produzione.local";
const BUCKET = "produzione", FILE_DATI = "verniciatura.json.gz", FILE_EXCEL = "Verniciatura.xlsx";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const ROW = 26;
let dati = null, righe = [], visibili = [], colonne = [], ix = {}, filtroAttivo = false;
let trovati = new Set();   // righe il cui codice corrisponde al "Codice..." (evidenziate in giallo)

function email(u) { u = u.trim(); return u.includes("@") ? u : u.toLowerCase() + "@" + DOMINIO; }

async function token() {
  const { data } = await sb.auth.getSession();
  return data.session?.access_token;
}

async function scarica(nome) {
  const t = await token();
  if (!t) { esci(); throw new Error("Sessione scaduta"); }
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/${BUCKET}/${nome}`,
    { headers: { Authorization: "Bearer " + t, apikey: SUPABASE_KEY }, cache: "no-store" });
  if (r.status === 400 || r.status === 404) throw new Error("Il foglio non è ancora stato pubblicato dal programma.");
  if (!r.ok) throw new Error("Errore " + r.status + " nel leggere " + nome);
  return r.blob();
}

async function carica() {
  $("aggiorna").disabled = true;
  try {
    const blob = await scarica(FILE_DATI);
    const testo = await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text();
    dati = JSON.parse(testo);
    prepara();
  } catch (e) {
    $("agg").textContent = e.message;
  } finally { $("aggiorna").disabled = false; }
}

function prepara() {
  colonne = dati.colonne;
  ix = {};
  colonne.forEach((c, i) => ix[c.n] = i);
  let padre = null;
  righe = dati.righe.map(r => {
    const riga = { p: !!r.p, l: r.l, c: r.c || "", k: r.k || "", b: r.b || null, i: r.i || "", v: r.v };
    if (riga.p) padre = riga;
    riga.h = riga.p ? riga : padre;
    riga.testo = r.v.join(" ").toLowerCase();
    return riga;
  });
  const d = new Date(dati.aggiornato);
  $("agg").textContent = "Aggiornato il " + d.toLocaleDateString("it-IT") + " alle " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

  // Larghezze come nel programma, un po' più larghe (il codice anche per il rientro dei livelli)
  // Stato: solo bollino e IMB, basta una colonna stretta
  const px = colonne.map((c, i) => i === ix["Stato"] ? 78 : Math.round(Math.max(c.w * 1.3, 46) + (i === ix["Articolo"] ? 40 : 0)));
  const larg = px.map(w => w + "px").join(" ");
  const intest = $("intestazione");
  intest.style.gridTemplateColumns = larg;
  intest.innerHTML = colonne.map((c, i) => `<div data-c="${i}" title="Clic per filtrare">${esc(c.n)}</div>`).join("");
  $("tabella").dataset.colonne = larg;
  const tot = px.reduce((s, w) => s + w, 0);
  intest.style.width = $("tabella").style.width = tot + "px";

  // i filtri restano ricaricando (sono per nome di colonna); quelli di colonne che non ci sono più si tolgono
  for (const n of Object.keys(filtri)) if (!(n in ix) && n !== IMB_KEY) delete filtri[n];
  filtra(false);   // ricaricando (ogni 5 minuti) si resta dove si era
}

// ===== Filtri per colonna, come nel programma: clic sull'intestazione, si spuntano uno o più valori
const VUOTO = "(vuote)";
let filtri = {};   // nome colonna → Set dei valori scelti
const BOLLINI = { "#1E1E1E": "Nero - da mandare in verniciatura", "#F59614": "Arancione - partita in parte",
  "#DC2828": "Rosso - partita tutta", "#28AA3C": "Verde - rientrata", "#00838F": "Verde mare - prodotto" };
const ORDINE_BOLLINI = Object.values(BOLLINI);
// Nel filtro Stato, sotto i bollini, l'imballo del codice padre (etichette colli): vale per tutte le righe della distinta,
// così filtrando bollino verde + "IMB - imballato tutto" si vedono le distinte rientrate e già imballate
const IMB_KEY = "Imballo";
const IMB_VALORI = ["Non imballato", "IMB n - imballato in parte", "IMB - imballato tutto"];
function valoreImb(r) { return !r.h.i ? IMB_VALORI[0] : r.h.i === "IMB" ? IMB_VALORI[2] : IMB_VALORI[1]; }

// Valore di una riga per il filtro: Stato = colore del bollino; Lista e Colore = quelli del codice padre (si vede la distinta intera)
function valoreFiltro(r, c) {
  const n = colonne[c].n;
  if (n === "Stato") return r.b ? (BOLLINI[r.b.toUpperCase()] || r.b) : "Nessun bollino";
  if (n === "Colore" || n === "Lista") return r.h.v[c] || VUOTO;
  return r.v[c] || VUOTO;
}

// Valori da mostrare nel filtro di una colonna: quelli delle righe che passano gli ALTRI filtri (come in Excel)
function valoriColonna(c) {
  const altre = righeFiltrate(colonne[c].n);
  const set = new Set(altre.map(r => valoreFiltro(r, c)));
  for (const v of filtri[colonne[c].n] || []) set.add(v);
  const n = colonne[c].n;
  let v = [...set];
  if (n === "Stato") v.sort((a, b) => (ORDINE_BOLLINI.indexOf(a) + 99) % 99 - (ORDINE_BOLLINI.indexOf(b) + 99) % 99);
  else {
    const data = s => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); return m ? m[3] + m[2] + m[1] : null; };
    v.sort((a, b) => a === VUOTO ? -1 : b === VUOTO ? 1
      : data(a) && data(b) ? data(a).localeCompare(data(b)) : a.localeCompare(b, "it", { numeric: true }));
    if (n === "Lista") v.reverse();
  }
  return v;
}

let popupCol = -1;
function apriFiltro(c, el) {
  popupCol = c;
  const n = colonne[c].n, scelti = filtri[n];
  $("popupTitolo").textContent = "Filtro: " + n;
  $("popupCerca").value = "";
  const lista = $("popupLista");
  const casella = (v, sel, gruppo, dot) => `<label><input type="checkbox" data-g="${gruppo}" value="${esc(v)}" ${!sel || sel.has(v) ? "checked" : ""}>` +
    `${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(v)}</label>`;
  lista.innerHTML = valoriColonna(c).map(v =>
    casella(v, scelti, "", n === "Stato" ? Object.entries(BOLLINI).find(([, t]) => t === v)?.[0] : null)).join("");
  if (n === "Stato") {
    // secondo gruppo: imballo del codice padre (valori presenti nelle righe che passano gli altri filtri)
    const presenti = new Set(righeFiltrate("Stato").map(valoreImb));
    for (const v of filtri[IMB_KEY] || []) presenti.add(v);
    lista.innerHTML += `<div class="gruppo">Imballo (etichette colli)</div>` +
      IMB_VALORI.filter(v => presenti.has(v)).map(v => casella(v, filtri[IMB_KEY], "imb", null)).join("");
  }
  const p = $("popup");
  p.style.display = "flex";
  const b = el.getBoundingClientRect();
  p.style.left = Math.max(16, Math.min(b.left, window.innerWidth - p.offsetWidth - 16)) + "px";
  p.style.top = Math.max(16, Math.min(b.bottom + 2, window.innerHeight - p.offsetHeight - 16)) + "px";
  $("popupCerca").focus();
}
function chiudiFiltro() { $("popup").style.display = "none"; popupCol = -1; }
function caselle(soloVisibili) {
  return [...$("popupLista").querySelectorAll("label")].filter(l => !soloVisibili || l.style.display !== "none").map(l => l.firstChild);
}
$("popupCerca").oninput = () => {
  const trova = cercatore($("popupCerca").value);
  for (const l of $("popupLista").querySelectorAll("label")) l.style.display = !trova || trova(l.textContent.toLowerCase()) ? "" : "none";
};
$("popupTutti").onclick = () => caselle(true).forEach(x => x.checked = true);
$("popupNessuno").onclick = () => caselle(true).forEach(x => x.checked = false);
$("popupTogli").onclick = () => {
  const n = colonne[popupCol].n;
  delete filtri[n];
  if (n === "Stato") delete filtri[IMB_KEY];
  chiudiFiltro(); filtra();
};
$("popupOk").onclick = () => {
  const n = colonne[popupCol].n;
  // con una ricerca nel filtro valgono solo i valori trovati e spuntati
  const cerca = $("popupCerca").value.trim() !== "";
  for (const [gruppo, chiave] of [["", n], ["imb", IMB_KEY]]) {
    const tutte = caselle(false).filter(x => x.dataset.g === gruppo);
    if (!tutte.length) continue;
    const scelte = (cerca ? caselle(true).filter(x => x.dataset.g === gruppo) : tutte).filter(x => x.checked).map(x => x.value);
    if (scelte.length === tutte.length) delete filtri[chiave];
    else filtri[chiave] = new Set(scelte);
  }
  chiudiFiltro();
  filtra();
};
$("popupCerca").addEventListener("keydown", e => { if (e.key === "Enter") $("popupOk").click(); if (e.key === "Escape") chiudiFiltro(); });
$("intestazione").addEventListener("click", e => {
  const d = e.target.closest("[data-c]");
  if (d) { e.stopPropagation(); popupCol === +d.dataset.c ? chiudiFiltro() : apriFiltro(+d.dataset.c, d); }
});
document.addEventListener("click", e => { if (popupCol >= 0 && !$("popup").contains(e.target)) chiudiFiltro(); });

// Cerca come nel programma: ? = una cifra/lettera qualsiasi, * = qualsiasi testo.
// intero: con ? e * deve corrispondere tutto il testo (es. codice 123*66 = inizia con 123 e finisce con 66)
function cercatore(s, intero) {
  s = s.trim().toLowerCase();
  if (!s) return null;
  if (/[?*]/.test(s)) {
    const corpo = s.split("").map(ch => ch === "?" ? "." : ch === "*" ? ".*" : ch.replace(/[.+^${}()|[\]\\]/g, "\\$&")).join("");
    const re = new RegExp(intero ? "^" + corpo + "$" : corpo);
    return t => re.test(t);
  }
  return t => t.includes(s);
}

// Righe che passano ricerche e filtri (escludi = nome di una colonna da non contare, per l'elenco dei valori del suo filtro)
function righeFiltrate(escludi) {
  const att = Object.entries(filtri).filter(([n]) => n !== escludi && n in ix).map(([n, s]) => [ix[n], s]);
  const imb = escludi === "Stato" ? null : filtri[IMB_KEY];   // imballo: sta nel filtro della colonna Stato
  const trova = cercatore($("cerca").value), codOk = cercatore($("cercaCodice").value, true);
  const iA = ix["Articolo"], iD = ix["Descrizione"];
  // Codice di qualsiasi livello: si tengono le distinte COMPLETE in cui c'è (cercato su tutte le righe, anche quelle
  // nascoste dai filtri), poi i filtri delle colonne scelgono quali righe vedere (es. Centro IM e M: i verniciati di quel SA)
  let distinte = null;
  trovati = new Set();
  if (codOk) {
    distinte = new Set();
    for (const r of righe) if (codOk(r.v[iA].toLowerCase())) { distinte.add(r.h); trovati.add(r); }
  }
  return righe.filter(r => {
    if (distinte && !distinte.has(r.h)) return false;
    for (const [c, s] of att) if (!s.has(valoreFiltro(r, c))) return false;
    if (imb && !imb.has(valoreImb(r))) return false;
    if (!trova) return true;
    // Cercando il codice o la descrizione del padre si vede tutta la distinta
    return trova(r.testo) || trova(r.h.v[iA].toLowerCase()) || trova(r.h.v[iD].toLowerCase());
  });
}

function filtra(inCima = true) {
  const nomi = Object.keys(filtri).filter(n => n in ix || n === IMB_KEY);
  const trova = $("cerca").value.trim() !== "", trovaCod = $("cercaCodice").value.trim() !== "";
  $("cerca").classList.toggle("attivo", trova);
  $("cercaCodice").classList.toggle("attivo", trovaCod);
  visibili = righeFiltrate(null);
  for (const d of $("intestazione").children) d.classList.toggle("filtrata", colonne[d.dataset.c].n in filtri || (colonne[d.dataset.c].n === "Stato" && IMB_KEY in filtri));
  $("attivi").innerHTML = nomi.length
    ? "Filtri: " + nomi.map(n => `<b>${esc(n)}</b> = ${esc([...filtri[n]].slice(0, 4).join(", "))}${filtri[n].size > 4 ? ` e altri ${filtri[n].size - 4}` : ""}`).join("  ·  ")
    : schede ? "" : "Clic sull'intestazione di una colonna per filtrare (anche più valori)";
  const padri = new Set(visibili.map(r => r.h)).size;   // anche se il padre è filtrato via
  filtroAttivo = nomi.length > 0 || trova || trovaCod;
  $("conta").textContent = `Distinte: ${padri.toLocaleString("it-IT")}  ·  righe: ${visibili.length.toLocaleString("it-IT")}` +
    (filtroAttivo ? "  (filtro attivo)" : "");
  $("vuoto").style.display = visibili.length ? "none" : "block";
  if (!$("excel").disabled) $("excel").textContent = filtroAttivo ? "Scarica Excel (righe filtrate)" : "Scarica Excel";
  posizioni();
  if (inCima) $("scroll").scrollTop = 0;
  disegna();
}

// ===== Vista: tabella come sul PC, o schede sullo smartphone (si sceglie da sola dalla larghezza, il pulsante Tabella/Schede la cambia)
const SCHEDA_PADRE = 70, SCHEDA_FIGLIO = 66;
// Sotto i 700 px schede, sopra i 900 px sempre la tabella; in mezzo (o cambiandola col pulsante) vale la scelta, ricordata sul telefono
const strettoMq = window.matchMedia("(max-width: 700px)"), medioMq = window.matchMedia("(max-width: 900px)");
let schede = false, pos = [0], sceltaVista = null;
try { sceltaVista = localStorage.getItem("vista"); } catch { }
function aggiornaVista() {
  const nuova = !medioMq.matches ? false : sceltaVista ? sceltaVista === "schede" : strettoMq.matches;
  const cambiata = nuova !== schede;
  schede = nuova;
  $("app").classList.toggle("schede", schede);
  $("vista").textContent = schede ? "Tabella" : "Schede";
  if (cambiata && dati) filtra();
}
$("vista").onclick = () => {
  sceltaVista = schede ? "tabella" : "schede";
  try { localStorage.setItem("vista", sceltaVista); } catch { }
  aggiornaVista();
};
strettoMq.addEventListener("change", aggiornaVista);
medioMq.addEventListener("change", aggiornaVista);
aggiornaVista();

// Inizio di ogni riga (le schede del padre sono più alte)
function posizioni() {
  pos = new Array(visibili.length + 1);
  pos[0] = 0;
  for (let n = 0; n < visibili.length; n++) pos[n + 1] = pos[n] + (!schede ? ROW : visibili[n].p ? SCHEDA_PADRE : SCHEDA_FIGLIO);
  $("tabella").style.height = pos[visibili.length] + "px";
}
function primaRiga(y) {   // prima riga che si vede a quell'altezza
  let lo = 0, hi = visibili.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (pos[m + 1] <= y) lo = m + 1; else hi = m; }
  return lo;
}

function valore(r, nome) { return nome in ix ? r.v[ix[nome]] || "" : ""; }
function bollinoHtml(r) { return r.b ? `<span class="dot" style="background:${r.b}"></span>` : ""; }
// Sul codice padre: IMB = tutti i pezzi imballati (etichette colli), verde; IMB n = imballati solo n pezzi, arancione
function imbHtml(r) { return r.i ? `<span class="imb" style="color:${r.i === "IMB" ? "#1b5e20" : "#e65100"}">${esc(r.i)}</span>` : ""; }
function titoloStato(r) { return [r.b ? BOLLINI[r.b.toUpperCase()] || "" : "", r.i].filter(Boolean).join(" · "); }

function scheda(r, n) {
  const q = valore(r, "Q.tà");
  const l1 = `<div class="l1">${bollinoHtml(r)}${imbHtml(r)}<span class="cod${trovati.has(r) ? " trovato" : ""}">${esc(valore(r, "Articolo"))}</span>${q ? `<span class="q">Q.tà ${esc(q)}</span>` : ""}</div>`;
  const l2 = `<div class="l2">${esc(valore(r, "Descrizione"))}</div>`;
  const campo = (et, nome) => { const v = valore(r, nome); return v ? `${et} <b>${esc(v)}</b>` : ""; };
  let l3;
  if (r.p) l3 = [esc(valore(r, "Ordine")), esc(valore(r, "Cliente")), campo("Cons.", "Consegna"), campo("Lista", "Lista"), campo("Col.", "Colore")];
  else {
    const part = valore(r, "Partiti"), rien = valore(r, "Rientrati"), m = valore(r, "Centro") === "M";
    l3 = [campo("Centro", "Centro"), campo("Dest.", "Dest."),
      part ? (m ? `<span class="tag cp">Part. ${esc(part)}</span>` : campo("Part.", "Partiti")) : "",
      rien ? (m ? `<span class="tag cr">Rientr. ${esc(rien)}</span>` : campo("Rientr.", "Rientrati")) : "",
      campo("Imb.", "Imballati"), esc(valore(r, "Verniciatore")), campo("Bolla", "Bolla part."), campo("Rientro", "Bolla rientro")];
  }
  const rientro = r.p ? 10 : 10 + Math.min(r.l, 5) * 10;   // livelli rientrati come il codice nella tabella
  return `<div class="scheda ${r.p ? "p" : r.k}" data-n="${n}" title="${esc(titoloStato(r))}" style="top:${pos[n]}px;height:${pos[n + 1] - pos[n]}px;padding-left:${rientro}px">` +
    `${l1}${l2}<div class="l3">${l3.filter(Boolean).join("  ·  ") || "&nbsp;"}</div></div>`;
}

// Tocco su una scheda: tutti i dati della riga
function apriDettaglio(r) {
  $("detTitolo").innerHTML = bollinoHtml(r) + imbHtml(r) + esc(valore(r, "Articolo"));
  $("detSotto").textContent = valore(r, "Descrizione");
  const righeDl = [];
  if (!r.p) righeDl.push(["Distinta", r.h.v[ix["Articolo"]] + " · " + valore(r.h, "Ordine") + " · " + valore(r.h, "Cliente")]);
  if (titoloStato(r)) righeDl.push(["Stato", titoloStato(r)]);
  colonne.forEach((c, i) => {
    if (c.n === "Stato" || c.n === "Articolo" || c.n === "Descrizione") return;
    const v = r.v[i] || (c.p && !r.p ? r.h.v[i] : "");
    if (v) righeDl.push([c.n, v]);
  });
  $("detDati").innerHTML = righeDl.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("dettaglio").style.display = "flex";
}
function chiudiDettaglio() { $("dettaglio").style.display = "none"; }
$("detChiudi").onclick = chiudiDettaglio;
$("dettaglio").addEventListener("click", e => { if (e.target === $("dettaglio")) chiudiDettaglio(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") chiudiDettaglio(); });
$("tabella").addEventListener("click", e => {
  if (!schede || popupCol >= 0) return;   // con il filtro aperto il tocco lo chiude soltanto
  const s = e.target.closest(".scheda");
  if (s) apriDettaglio(visibili[+s.dataset.n]);
});

function disegna() {
  const sc = $("scroll"), tab = $("tabella");
  const da = Math.max(0, primaRiga(sc.scrollTop) - 10);
  const a = Math.min(visibili.length, primaRiga(sc.scrollTop + sc.clientHeight) + 20);
  if (schede) {
    let html = "";
    for (let n = da; n < a; n++) html += scheda(visibili[n], n);
    tab.innerHTML = html;
    return;
  }
  const iS = ix["Stato"], iA = ix["Articolo"], iP = ix["Partiti"], iR = ix["Rientrati"], iC = ix["Centro"];
  let html = "";
  for (let n = da; n < a; n++) {
    const r = visibili[n];
    // Sui figli ordine, cliente, consegna e lista restano vuoti (si vedono sul padre), se il padre è sopra
    const conPadre = !r.p && n > 0 && visibili[n - 1] && (visibili[n - 1].h === r.h);
    let celle = "";
    for (let c = 0; c < colonne.length; c++) {
      const col = colonne[c];
      let v = r.v[c], cls = col.d ? "d" : "";
      if (!r.p && col.p && conPadre) v = "";
      if (c === iS) {
        // come nel programma: solo il bollino (e IMB sul padre), senza scritte
        celle += `<div title="${esc(titoloStato(r))}">${bollinoHtml(r)}${imbHtml(r)}</div>`;
        continue;
      }
      if (c === iA) v = " ".repeat(r.l * 2) + v;   // codice rientrato per livello
      if (c === iA && trovati.has(r)) cls += " trovato";
      if (r.v[iC] === "M" && v !== "" && c === iP) cls += " cp";
      if (r.v[iC] === "M" && v !== "" && c === iR) cls += " cr";
      celle += `<div class="${cls}" title="${esc(r.v[c])}">${esc(v)}</div>`;
    }
    html += `<div class="riga ${r.p ? "p" : r.k}" style="top:${n * ROW}px;grid-template-columns:${tab.dataset.colonne}">${celle}</div>`;
  }
  tab.innerHTML = html;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Senza filtri: il file Excel fatto dal programma (tutto il foglio). Con un filtro: un Excel uguale ma solo con le righe che si vedono.
async function scaricaExcel() {
  const b = $("excel");
  b.disabled = true; b.textContent = "Scarico...";
  try {
    const d = dati ? new Date(dati.aggiornato) : new Date();
    const giorno = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    let blob, nome;
    if (filtroAttivo && dati) {
      if (!visibili.length) { alert("Nessuna riga con questi filtri."); return; }
      blob = await excelFiltrato();
      const liste = filtri["Lista"];
      nome = `Verniciatura ${liste && liste.size === 1 ? [...liste][0] : "filtrato"} ${giorno}.xlsx`;
    } else {
      blob = await scarica(FILE_EXCEL);
      nome = `Verniciatura ${giorno}.xlsx`;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert(e.message); }
  finally { b.disabled = false; b.textContent = filtroAttivo ? "Scarica Excel (righe filtrate)" : "Scarica Excel"; }
}

function caricaScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Non riesco a caricare il generatore Excel: controlla la connessione."));
    document.head.appendChild(s);
  });
}

// Testo come si vede → numero o data per Excel (come nel file del programma)
function valoreExcel(t, col) {
  if (t === "") return null;
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);
  if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  if (col.d) { const n = Number(t.replace(/\./g, "").replace(",", ".")); if (Number.isFinite(n)) return n; }
  return t;
}

// Stesso formato del file del programma: colonne del foglio + Tipo + Chiave, stessi colori
async function excelFiltrato() {
  if (!window.ExcelJS) await caricaScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Verniciatura", { views: [{ state: "frozen", ySplit: 1 }] });
  ws.columns = [...colonne.map(c => ({ header: c.n, width: Math.min(45, Math.max(5, c.w / 6.5)) })),
    { header: "Tipo", width: 12 }, { header: "Chiave", width: 14 }];
  const nc = colonne.length + 2;
  const h = ws.getRow(1);
  h.font = { bold: true, color: { argb: "FFFFFFFF" } };
  for (let c = 1; c <= nc; c++) h.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF37474F" } };
  const sfondi = { p: "FF96BEF0", mr: "FFC8EEC8", mp: "FFFFDEAA", mv: "FFFFCDCD" };
  for (const r of visibili) {
    const row = ws.addRow([...r.v.map((t, i) => valoreExcel(t, colonne[i])), r.p ? "Padre" : "Componente", r.c]);
    row.eachCell((cell, n) => {
      if (cell.value instanceof Date) cell.numFmt = "dd/mm/yyyy";
      else if (typeof cell.value === "number") cell.numFmt = "#,##0.##";
    });
    const s = sfondi[r.p ? "p" : r.k];
    if (s) for (let c = 1; c <= nc; c++) row.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: s } };
    if (r.p) row.font = { bold: true };
  }
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: nc } };
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function mostraApp() {
  $("login").style.display = "none";
  $("app").style.display = "flex";
  carica();
}

async function esci() {
  await sb.auth.signOut();
  dati = null;
  $("app").style.display = "none";
  $("login").style.display = "grid";
}

$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  $("errore").textContent = "";
  $("entra").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: email($("utente").value), password: $("password").value });
  $("entra").disabled = false;
  if (error) { $("errore").textContent = "Utente o password sbagliati."; return; }
  $("password").value = "";
  mostraApp();
});
$("esci").onclick = esci;
$("aggiorna").onclick = carica;
$("excel").onclick = scaricaExcel;
$("togli").onclick = () => { filtri = {}; $("cerca").value = ""; $("cercaCodice").value = ""; filtra(); };
$("cercaCodice").oninput = () => { clearTimeout(tCerca); tCerca = setTimeout(filtra, 250); };
let tCerca;
$("cerca").oninput = () => { clearTimeout(tCerca); tCerca = setTimeout(filtra, 250); };
$("scroll").addEventListener("scroll", () => requestAnimationFrame(disegna), { passive: true });
window.addEventListener("resize", () => dati && disegna());
// A pagina aperta si ricarica da sola ogni 5 minuti (il programma pubblica quando cambia qualcosa)
setInterval(() => { if (dati && document.visibilityState === "visible") carica(); }, 5 * 60 * 1000);

sb.auth.getSession().then(({ data }) => { if (data.session) mostraApp(); });
</script>
