<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verniciatura - Produzione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* Stessi colori della scheda Admin → Verniciatura del programma */
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #1d2327; --muted: #5f6b73; --line: #d5dbe0;
    --head: #37474f; --padre: #96bef0; --mr: #c8eec8; --mp: #ffdeaa; --mv: #ffcdcd;
    --rosso: #dc3232; --verde: #28963c; --blu: #1565c0; --verdescuro: #1b5e20;
    --row: 26px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.3 Inter, "Segoe UI", system-ui, sans-serif; }
  button, input, select { font: inherit; }
  .btn { border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 700; color: #fff; cursor: pointer; white-space: nowrap; }
  .btn:disabled { opacity: .55; cursor: default; }
  .verde { background: var(--verdescuro); } .blu { background: var(--blu); } .grigio { background: #546e7a; }

  /* Accesso */
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  #login form { background: var(--card); padding: 28px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  #login h1 { margin: 0 0 4px; font-size: 20px; }
  #login p { margin: 0 0 20px; color: var(--muted); }
  #login label { display: block; font-weight: 600; margin: 12px 0 4px; }
  #login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; }
  #login .btn { width: 100%; margin-top: 20px; padding: 10px; }
  #errore { color: var(--rosso); margin-top: 12px; min-height: 1.3em; }

  /* Foglio */
  #app { display: none; height: 100%; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  #agg { color: var(--muted); }
  .spazio { flex: 1; }
  .filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .filtri input[type=search] { width: 230px; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .filtri select { padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; max-width: 170px; background: #fff; }
  .filtri select.attivo, .filtri input.attivo { background: #ffe282; }
  #scroll { flex: 1; overflow: auto; position: relative; background: #fff; }
  #tabella { position: relative; }
  .riga { display: grid; height: var(--row); position: absolute; left: 0; }
  .riga > div { padding: 0 5px; line-height: var(--row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid #e3e7ea; border-bottom: 1px solid #e3e7ea; }
  .riga > div.d { text-align: right; }
  #intestazione { position: sticky; top: 0; z-index: 2; display: grid; height: 30px; }
  #intestazione > div { background: var(--head); color: #fff; font-weight: 700; padding: 0 5px; line-height: 30px; white-space: nowrap; overflow: hidden; border-right: 1px solid #4f6570; }
  .p > div { background: var(--padre); font-weight: 700; font-size: 14px; }
  .mr > div { background: var(--mr); } .mp > div { background: var(--mp); } .mv > div { background: var(--mv); }
  .riga > div.cp { background: var(--rosso); color: #fff; font-weight: 700; }
  .riga > div.cr { background: var(--verde); color: #fff; font-weight: 700; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  footer { background: var(--card); border-top: 1px solid var(--line); padding: 6px 16px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  #vuoto { padding: 40px 16px; color: var(--muted); text-align: center; display: none; }
  @media (max-width: 640px) {
    header, .filtri, footer { padding-left: 16px; padding-right: 16px; }
    .filtri input[type=search] { width: 100%; }
    .filtri > * { min-width: 0; }
    .filtri select { flex: 1 1 40%; width: 0; max-width: none; }
  }
</style>
</head>
<body>

<div id="login">
  <form id="formLogin" autocomplete="on">
    <h1>Verniciatura</h1>
    <p>Foglio distinte aperte · sola lettura</p>
    <label for="utente">Utente</label>
    <input id="utente" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn blu" type="submit" id="entra">Entra</button>
    <div id="errore"></div>
  </form>
</div>

<div id="app">
  <header>
    <h1>Verniciatura</h1>
    <span id="agg"></span>
    <span class="spazio"></span>
    <button class="btn verde" id="excel">Scarica Excel</button>
    <button class="btn blu" id="aggiorna">Aggiorna</button>
    <button class="btn grigio" id="esci">Esci</button>
  </header>
  <div class="filtri">
    <input type="search" id="cerca" placeholder="Cerca codice, descrizione, ordine...">
    <select id="fLista"></select>
    <select id="fCliente"></select>
    <select id="fCentro"></select>
    <select id="fColore"></select>
    <select id="fStato"></select>
    <button class="btn grigio" id="togli">Togli filtri</button>
  </div>
  <div id="scroll">
    <div id="intestazione"></div>
    <div id="tabella"></div>
    <div id="vuoto">Nessuna riga con questi filtri.</div>
  </div>
  <footer><span id="conta"></span></footer>
</div>

<script>
// ===== Da compilare con i dati del progetto Supabase (Project Settings → API). La chiave pubblica si può vedere: i dati li protegge il login.
const SUPABASE_URL = "https://yzkfycwrvvqlcrnakpgu.supabase.co";
const SUPABASE_KEY = "sb_publishable_nuXDmQzVBxX-0Q2zSh4-5g_7vUKw_i0";
// Uguale al programma: un nome utente senza @ diventa nome@produzione.local
const DOMINIO = "produzione.local";
const BUCKET = "produzione", FILE_DATI = "verniciatura.json.gz", FILE_EXCEL = "Verniciatura.xlsx";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const ROW = 26;
let dati = null, righe = [], visibili = [], colonne = [], ix = {}, filtroAttivo = false;

function email(u) { u = u.trim(); return u.includes("@") ? u : u.toLowerCase() + "@" + DOMINIO; }

async function token() {
  const { data } = await sb.auth.getSession();
  return data.session?.access_token;
}

async function scarica(nome) {
  const t = await token();
  if (!t) { esci(); throw new Error("Sessione scaduta"); }
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/${BUCKET}/${nome}`,
    { headers: { Authorization: "Bearer " + t, apikey: SUPABASE_KEY }, cache: "no-store" });
  if (r.status === 400 || r.status === 404) throw new Error("Il foglio non è ancora stato pubblicato dal programma.");
  if (!r.ok) throw new Error("Errore " + r.status + " nel leggere " + nome);
  return r.blob();
}

async function carica() {
  $("aggiorna").disabled = true;
  try {
    const blob = await scarica(FILE_DATI);
    const testo = await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text();
    dati = JSON.parse(testo);
    prepara();
  } catch (e) {
    $("agg").textContent = e.message;
  } finally { $("aggiorna").disabled = false; }
}

function prepara() {
  colonne = dati.colonne;
  ix = {};
  colonne.forEach((c, i) => ix[c.n] = i);
  let padre = null;
  righe = dati.righe.map(r => {
    const riga = { p: !!r.p, l: r.l, c: r.c || "", k: r.k || "", b: r.b || null, v: r.v };
    if (riga.p) padre = riga;
    riga.h = riga.p ? riga : padre;
    riga.testo = r.v.join(" ").toLowerCase();
    return riga;
  });
  const d = new Date(dati.aggiornato);
  $("agg").textContent = "Aggiornato il " + d.toLocaleDateString("it-IT") + " alle " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

  // Larghezze come nel programma, un po' più larghe (il codice anche per il rientro dei livelli)
  const px = colonne.map((c, i) => Math.round(Math.max(c.w * 1.3, 46) + (i === ix["Articolo"] ? 40 : 0)));
  const larg = px.map(w => w + "px").join(" ");
  const intest = $("intestazione");
  intest.style.gridTemplateColumns = larg;
  intest.innerHTML = colonne.map(c => `<div>${esc(c.n)}</div>`).join("");
  $("tabella").dataset.colonne = larg;
  const tot = px.reduce((s, w) => s + w, 0);
  intest.style.width = $("tabella").style.width = tot + "px";

  riempi("fLista", "Lista", r => r.h.v[ix["Lista"]], true);
  riempi("fCliente", "Cliente", r => r.h.v[ix["Cliente"]]);
  riempi("fCentro", "Centro", r => r.v[ix["Centro"]]);
  riempi("fColore", "Colore", r => r.h.v[ix["Colore"]]);
  riempi("fStato", "Stato", r => r.v[ix["Stato"]] || "(vuoto)");
  filtra(false);   // ricaricando (ogni 5 minuti) si resta dove si era
}

function riempi(id, nome, f, inverso) {
  const sel = $(id), prima = sel.value;
  const valori = [...new Set(righe.map(f).filter(v => v !== undefined && v !== ""))]
    .sort((a, b) => a.localeCompare(b, "it", { numeric: true }));
  if (inverso) valori.reverse();
  sel.innerHTML = `<option value="">${nome}: tutti</option>` + valori.map(v => `<option>${esc(v)}</option>`).join("");
  sel.value = valori.includes(prima) ? prima : "";
  sel._f = f;
}

// Cerca come nel programma: ? = una cifra/lettera qualsiasi, * = qualsiasi testo
function cercatore(s) {
  s = s.trim().toLowerCase();
  if (!s) return null;
  if (/[?*]/.test(s)) {
    const re = new RegExp(s.split("").map(ch => ch === "?" ? "." : ch === "*" ? ".*" : ch.replace(/[.+^${}()|[\]\\]/g, "\\$&")).join(""));
    return t => re.test(t);
  }
  return t => t.includes(s);
}

function filtra(inCima = true) {
  const sel = ["fLista", "fCliente", "fCentro", "fColore", "fStato"].map(id => $(id)).filter(s => s.value !== "");
  ["fLista", "fCliente", "fCentro", "fColore", "fStato"].forEach(id => $(id).classList.toggle("attivo", $(id).value !== ""));
  const trova = cercatore($("cerca").value);
  $("cerca").classList.toggle("attivo", !!trova);
  const iA = ix["Articolo"], iD = ix["Descrizione"];
  visibili = righe.filter(r => {
    for (const s of sel) if (String(s._f(r)) !== s.value) return false;
    if (!trova) return true;
    // Cercando il codice o la descrizione del padre si vede tutta la distinta
    return trova(r.testo) || trova(r.h.v[iA].toLowerCase()) || trova(r.h.v[iD].toLowerCase());
  });
  const padri = new Set(visibili.map(r => r.h)).size;   // anche se il padre è filtrato via
  $("conta").textContent = `Distinte: ${padri.toLocaleString("it-IT")}  ·  righe: ${visibili.length.toLocaleString("it-IT")}` +
    (sel.length || trova ? "  (filtro attivo)" : "");
  $("vuoto").style.display = visibili.length ? "none" : "block";
  filtroAttivo = sel.length > 0 || !!trova;
  if (!$("excel").disabled) $("excel").textContent = filtroAttivo ? "Scarica Excel (righe filtrate)" : "Scarica Excel";
  $("tabella").style.height = visibili.length * ROW + "px";
  if (inCima) $("scroll").scrollTop = 0;
  disegna();
}

function disegna() {
  const sc = $("scroll"), tab = $("tabella");
  const da = Math.max(0, Math.floor(sc.scrollTop / ROW) - 10);
  const a = Math.min(visibili.length, da + Math.ceil(sc.clientHeight / ROW) + 20);
  const iS = ix["Stato"], iA = ix["Articolo"], iP = ix["Partiti"], iR = ix["Rientrati"], iC = ix["Centro"];
  let html = "";
  for (let n = da; n < a; n++) {
    const r = visibili[n];
    // Sui figli ordine, cliente, consegna e lista restano vuoti (si vedono sul padre), se il padre è sopra
    const conPadre = !r.p && n > 0 && visibili[n - 1] && (visibili[n - 1].h === r.h);
    let celle = "";
    for (let c = 0; c < colonne.length; c++) {
      const col = colonne[c];
      let v = r.v[c], cls = col.d ? "d" : "";
      if (!r.p && col.p && conPadre) v = "";
      if (c === iS) { celle += `<div title="${esc(v)}">${r.b ? `<span class="dot" style="background:${r.b}"></span>` : ""}${esc(v)}</div>`; continue; }
      if (c === iA) v = " ".repeat(r.l * 2) + v;   // codice rientrato per livello
      if (r.v[iC] === "M" && v !== "" && c === iP) cls += " cp";
      if (r.v[iC] === "M" && v !== "" && c === iR) cls += " cr";
      celle += `<div class="${cls}" title="${esc(r.v[c])}">${esc(v)}</div>`;
    }
    html += `<div class="riga ${r.p ? "p" : r.k}" style="top:${n * ROW}px;grid-template-columns:${tab.dataset.colonne}">${celle}</div>`;
  }
  tab.innerHTML = html;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Senza filtri: il file Excel fatto dal programma (tutto il foglio). Con un filtro: un Excel uguale ma solo con le righe che si vedono.
async function scaricaExcel() {
  const b = $("excel");
  b.disabled = true; b.textContent = "Scarico...";
  try {
    const d = dati ? new Date(dati.aggiornato) : new Date();
    const giorno = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    let blob, nome;
    if (filtroAttivo && dati) {
      if (!visibili.length) { alert("Nessuna riga con questi filtri."); return; }
      blob = await excelFiltrato();
      nome = `Verniciatura ${$("fLista").value || "filtrato"} ${giorno}.xlsx`;
    } else {
      blob = await scarica(FILE_EXCEL);
      nome = `Verniciatura ${giorno}.xlsx`;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert(e.message); }
  finally { b.disabled = false; b.textContent = filtroAttivo ? "Scarica Excel (righe filtrate)" : "Scarica Excel"; }
}

function caricaScript(src) {
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Non riesco a caricare il generatore Excel: controlla la connessione."));
    document.head.appendChild(s);
  });
}

// Testo come si vede → numero o data per Excel (come nel file del programma)
function valoreExcel(t, col) {
  if (t === "") return null;
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);
  if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  if (col.d) { const n = Number(t.replace(/\./g, "").replace(",", ".")); if (Number.isFinite(n)) return n; }
  return t;
}

// Stesso formato del file del programma: colonne del foglio + Tipo + Chiave, stessi colori
async function excelFiltrato() {
  if (!window.ExcelJS) await caricaScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Verniciatura", { views: [{ state: "frozen", ySplit: 1 }] });
  ws.columns = [...colonne.map(c => ({ header: c.n, width: Math.min(45, Math.max(5, c.w / 6.5)) })),
    { header: "Tipo", width: 12 }, { header: "Chiave", width: 14 }];
  const nc = colonne.length + 2;
  const h = ws.getRow(1);
  h.font = { bold: true, color: { argb: "FFFFFFFF" } };
  for (let c = 1; c <= nc; c++) h.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF37474F" } };
  const sfondi = { p: "FF96BEF0", mr: "FFC8EEC8", mp: "FFFFDEAA", mv: "FFFFCDCD" };
  for (const r of visibili) {
    const row = ws.addRow([...r.v.map((t, i) => valoreExcel(t, colonne[i])), r.p ? "Padre" : "Componente", r.c]);
    row.eachCell((cell, n) => {
      if (cell.value instanceof Date) cell.numFmt = "dd/mm/yyyy";
      else if (typeof cell.value === "number") cell.numFmt = "#,##0.##";
    });
    const s = sfondi[r.p ? "p" : r.k];
    if (s) for (let c = 1; c <= nc; c++) row.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: s } };
    if (r.p) row.font = { bold: true };
  }
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: nc } };
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function mostraApp() {
  $("login").style.display = "none";
  $("app").style.display = "flex";
  carica();
}

async function esci() {
  await sb.auth.signOut();
  dati = null;
  $("app").style.display = "none";
  $("login").style.display = "grid";
}

$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  $("errore").textContent = "";
  $("entra").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: email($("utente").value), password: $("password").value });
  $("entra").disabled = false;
  if (error) { $("errore").textContent = "Utente o password sbagliati."; return; }
  $("password").value = "";
  mostraApp();
});
$("esci").onclick = esci;
$("aggiorna").onclick = carica;
$("excel").onclick = scaricaExcel;
$("togli").onclick = () => { ["fLista", "fCliente", "fCentro", "fColore", "fStato"].forEach(id => $(id).value = ""); $("cerca").value = ""; filtra(); };
["fLista", "fCliente", "fCentro", "fColore", "fStato"].forEach(id => $(id).onchange = filtra);
let tCerca;
$("cerca").oninput = () => { clearTimeout(tCerca); tCerca = setTimeout(filtra, 250); };
$("scroll").addEventListener("scroll", () => requestAnimationFrame(disegna), { passive: true });
window.addEventListener("resize", () => dati && disegna());
// A pagina aperta si ricarica da sola ogni 5 minuti (il programma pubblica quando cambia qualcosa)
setInterval(() => { if (dati && document.visibilityState === "visible") carica(); }, 5 * 60 * 1000);

sb.auth.getSession().then(({ data }) => { if (data.session) mostraApp(); });
</script>
</body>
</html>
